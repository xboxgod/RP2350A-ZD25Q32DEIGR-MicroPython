name: Build MicroPython for Custom RP2350A (ZD25Q32D)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Tag
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] \vert{}\vert{} [ -z "$LATEST_TAG" ]; then
            echo "获取最新版本失败！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'\%Y\%m\%d')" >> $GITHUB_ENV

      - name: Checkout MicroPython Source Code
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        # 补全了固件签名必须的 python3-pyelftools 和 libc 库，防止打包 UF2 时报错
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential python3 python3-pip python3-pyelftools

      - name: Build mpy-cross and Fetch Submodules
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules

      - name: Create Custom Board Profile
        run: |
          # 1. 复制官方 RPI_PICO2 目录作为基础，继承完整的 RP2350 系统级参数
          cp -r ports/rp2/boards/RPI_PICO2 ports/rp2/boards/RP2350_ZD25Q32D
          BOARD_CMAKE="ports/rp2/boards/RP2350_ZD25Q32D/mpconfigboard.cmake"
          BOARD_H="ports/rp2/boards/RP2350_ZD25Q32D/mpconfigboard.h"

          # 2. 修改 CMake：强行指定底层 Boot2 为 generic_03h，避开 Flash 硬件锁死坑
          sed -i 's/RPI_PICO2/RP2350_ZD25Q32D/g' $BOARD_CMAKE
          echo 'set(PICO_DEFAULT_BOOT_STAGE2 "boot2_generic_03h" CACHE STRING "" FORCE)' >> $BOARD_CMAKE
          echo 'set(PICO_FLASH_SIZE_BYTES 4194304 CACHE STRING "" FORCE)' >> $BOARD_CMAKE
          echo 'set(PICO_FLASH_SPI_CLKDIV 8 CACHE STRING "" FORCE)' >> $BOARD_CMAKE

          # 3. 修改头文件：精准删除原生定义，换上您的定制引脚
          # 用 sed 删除官方默认的板载 LED 和默认 I2C 定义
          sed -i '/MICROPY_HW_LED_STATUS/d' $BOARD_H
          sed -i '/MICROPY_HW_I2C0_SDA/d' $BOARD_H
          sed -i '/MICROPY_HW_I2C0_SCL/d' $BOARD_H
          sed -i '/MICROPY_HW_BOARD_NAME/d' $BOARD_H

          # 追加您专属的硬件配置
          cat <<EOF >> $BOARD_H
          
          #define MICROPY_HW_BOARD_NAME "RP2350A ZD25Q32D Custom"
          
          // 自定义 I2C0 引脚映射
          #define MICROPY_HW_I2C0_SDA (0)
          #define MICROPY_HW_I2C0_SCL (1)
          
          // 彻底解绑 GPIO25 的系统状态灯功能，留给客户当纯通用 IO
          #undef MICROPY_HW_LED_STATUS
          #undef MICROPY_HW_LED_PIN
          EOF

      - name: Compile RP2350 Firmware
        run: |
          cd ports/rp2
          make BOARD=RP2350_ZD25Q32D -j$(nproc)

      - name: Prepare Named UF2 File
        run: |
          TARGET_FILENAME="RP2350A_ZD25Q32D_03h-${BUILD_DATE}-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RP2350_ZD25Q32D/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rp2350-zd25q32d-${{ env.LATEST_TAG }}
          name: MicroPython ${{ env.LATEST_TAG }} (RP2350A Custom Board)
          body: |
            针对定制 RP2350A 核心板 (ZD25Q32D 4MB) 的专属编译固件：
            1. **核心修复**：Boot2 强制替换为 `boot2_generic_03h`，彻底解决国产 Flash 在未开启 QE 时的上电启动死机问题。
            2. **硬件修改**：默认 I2C0 重新映射 -> SDA 位于 Pin 0，SCL 位于 Pin 1。
            3. **IO 释放**：解除 GPIO 25 作为系统状态指示灯的绑定，用户可自由控制。
          files: ${{ env.TARGET_FILENAME }}
