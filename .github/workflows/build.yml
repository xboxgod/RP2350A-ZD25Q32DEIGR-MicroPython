name: Auto Build MicroPython for RP2350A 4MB Flash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Release Info
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] \vert{}\vert{} [ -z "$LATEST_TAG" ]; then
            echo "获取最新版本失败！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Check if Version Already Built
        id: check_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "版本 $LATEST_TAG 已存在，跳过编译。"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "发现官方新版本 $LATEST_TAG，准备编译！"
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Checkout MicroPython Source Code
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential jq python3-pip python3-pyelftools

      - name: Build mpy-cross and Fetch Submodules
        if: env.SKIP != 'true'
        run: |
          make -C mpy-cross
          make -C ports/rp2 submodules

      - name: Patch Board Config for ZD25WQ32C (4MB Flash & Dual-SPI)
        if: env.SKIP != 'true'
        run: |
          BOARD_CMAKE="ports/rp2/boards/RPI_PICO2/mpconfigboard.cmake"

          # 1. 修正 Flash 容量为 4MB (32Mbit = 4194304 字节)
          # 修复 MicroPython 默认按 8MB 挂载 LittleFS 文件系统时导致的越界硬崩溃
          echo "set(PICO_FLASH_SIZE_BYTES 4194304)" >> $BOARD_CMAKE

          # 2. 修正 RP2350 镜像头传输模式为双线 Dual-SPI 模式 (Pico SDK 2.x 标准语法)
          # 解决国产 Flash 出厂 QE=0 导致 4 线 QSPI 读取全 0xFF 引发的 BootROM 死锁
          echo "set(PICO_FLASH_MODE \"qspi_dual_i_o_read\")" >> $BOARD_CMAKE

          # 3. 降低 Flash 时钟分频至 37.5MHz (150MHz / 4)
          # 解决 3.3V 国产 Flash 在 75MHz 高频双线模式下的时序丢步问题
          echo "set(PICO_FLASH_SPI_CLKDIV 4)" >> $BOARD_CMAKE

      - name: Compile RP2350 Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          make BOARD=RPI_PICO2

      - name: Prepare Named UF2 File
        if: env.SKIP != 'true'
        run: |
          TARGET_FILENAME="RPI_PICO2_ZD25WQ32C_4MB-${BUILD_DATE}-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RPI_PICO2/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: MicroPython ${{ env.LATEST_TAG }} (RP2350A 4MB Dual-SPI)
          body: |
            针对 RP2350A + 4MB (32Mbit) ZD25Q32DEIGR 之类国产 SPI Flash 的自动 Patch 固件：
            1. 修正容量限制为 4MB (`PICO_FLASH_SIZE_BYTES=4194304`)，修复文件系统越界挂载卡死；
            2. 传输模式切换为 Dual-SPI (`PICO_FLASH_MODE=qspi_dual_i_o_read`)，避开 Flash 出厂 QE=0 导致的开机死锁；
            3. 降低 Flash 时钟至 37.5MHz (`PICO_FLASH_SPI_CLKDIV=4`)，提升时序兼容性。
            对应官方上游版本：${{ env.LATEST_TAG }}
          files: ${{ env.TARGET_FILENAME }}
