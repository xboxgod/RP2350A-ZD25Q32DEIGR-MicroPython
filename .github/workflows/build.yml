name: Build RetroMagic RP2350

on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间 10:00 自动巡检
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新编译（跳过 Release 已存在检查）'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MicroPython Master Branch
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: master
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Get MicroPython Official Version & Commit
        id: mp_info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          MP_VERSION=$(git describe --tags --always)
          DATE_TAG=$(date +'%Y%m%d')
          
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "MP_VERSION=${MP_VERSION}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          
          RELEASE_TAG="v-${COMMIT_HASH}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          
          echo "官方最新 Commit: ${COMMIT_HASH}"
          echo "官方 MicroPython 版本: ${MP_VERSION}"
          echo "构建日期: ${DATE_TAG}"

      - name: Smart Check Build Eligibility
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: "${{ github.event_name }}"
          FORCE_INPUT: "${{ inputs.force_rebuild }}"
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_INPUT" = "true" ]; then
            echo "🚀 手动触发：强制执行重新编译！"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            if gh release view "${{ env.RELEASE_TAG }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
              echo "☕ 定时巡检：官方无新 Commit (已构建过 Tag: ${{ env.RELEASE_TAG }})，自动跳过。"
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "⚡ 定时巡检：检测到官方有新 Commit，触发自动编译！"
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install Build Dependencies
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential python3 python3-pip python3-pyelftools pkg-config xxd

      - name: Build mpy-cross and Update Submodules
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules

      - name: Setup Board CMake Policy
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          BOARD_DIR="ports/rp2/boards/RETROMAGIC_RP2350"
          mkdir -p $BOARD_DIR

          cat << 'EOF' > $BOARD_DIR/mpconfigboard.cmake
          set(MICROPY_BOARD_TARGET "rp2350-arm-s")
          set(PICO_BOARD "pico2")
          set(PICO_FLASH_SIZE_BYTES 16777216)
          set(PICO_EMBED_XIP_SETUP 1 CACHE STRING "" FORCE)
          add_compile_definitions(PICO_EMBED_XIP_SETUP=1)
          set(PICO_FLASH_SPI_CLKDIV 6 CACHE STRING "" FORCE)
          add_compile_definitions(PICO_FLASH_SPI_CLKDIV=6)
          EOF

      - name: Matrix Compile (2MB, 4MB, 8MB, 16MB)
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          BOARD_DIR="ports/rp2/boards/RETROMAGIC_RP2350"
          CLEAN_MP_VERSION=$(echo "${{ env.MP_VERSION }}" | tr '/' '_')
          
          SIZES=(2 4 8 16)
          
          for SIZE in "${SIZES[@]}"; do
            echo "========================================="
            echo "🚀 开始编译 ${SIZE}MB 版本..."
            
            if [ $SIZE -eq 2 ]; then
              FS_BASE=$((1 * 1024 * 1024))
              FS_BYTES=$((1 * 1024 * 1024))
            else
              FS_BASE=$((2 * 1024 * 1024))
              TOTAL_BYTES=$((SIZE * 1024 * 1024))
              FS_BYTES=$((TOTAL_BYTES - FS_BASE))
            fi
            
            cat << EOF > $BOARD_DIR/mpconfigboard.h
          #ifndef MICROPY_INCLUDED_MPCONFIGBOARD_H
          #define MICROPY_INCLUDED_MPCONFIGBOARD_H
          #define MICROPY_HW_BOARD_NAME          "RetroMagic RP2350"
          #define MICROPY_HW_MCU_NAME            "RP2350"
          #undef MICROPY_HW_ENABLE_PSRAM
          #define MICROPY_HW_ENABLE_PSRAM        (0)
          #undef PICO_FLASH_SPI_CLKDIV
          #define PICO_FLASH_SPI_CLKDIV          6
          #undef MICROPY_HW_FLASH_STORAGE_BASE
          #define MICROPY_HW_FLASH_STORAGE_BASE  (${FS_BASE})
          #undef MICROPY_HW_FLASH_STORAGE_BYTES
          #define MICROPY_HW_FLASH_STORAGE_BYTES (${FS_BYTES})
          #endif
          EOF
            
            make -C ports/rp2 BOARD=RETROMAGIC_RP2350 clean
            make -C ports/rp2 BOARD=RETROMAGIC_RP2350 -j$(nproc)
            
            TARGET_FILENAME="RetroMagic_RP2350_${SIZE}MB_${CLEAN_MP_VERSION}.uf2"
            cp ports/rp2/build-RETROMAGIC_RP2350/firmware.uf2 "${TARGET_FILENAME}"
            echo "✅ ${SIZE}MB 版本编译完成：${TARGET_FILENAME}"
            
          done

      - name: Verify UF2 Architecture Safety (Family ID Check)
        if: steps.check_release.outputs.should_build == 'true'
        shell: bash
        run: |
          UF2_FILE=$(ls RetroMagic_RP2350_4MB_*.uf2)
          echo "=== 检查 UF2 Family ID (偏移 28-31 字节) ==="
          HEX_ID=$(xxd -s 28 -l 4 "$UF2_FILE" | awk '{print $2$3}' | tr -d ' \n\r')
          echo "读取到的 Family ID (16进制): $HEX_ID"
          case "$HEX_ID" in
            57ff8be4|59ff8be4) echo "✅ 架构校验通过！" ;;
            *) echo "❌ 架构校验失败！" && exit 1 ;;
          esac

      - name: Generate Release Notes File
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          cat << 'EOF' > release_notes.md
          ### ✨ RetroMagic RP2350 Universal Flash MicroPython
          ### ✨ RetroMagic RP2350 多硬件兼容版本 - 官方版同步更新

          ---

          #### 📋 Release Notes / 发布说明

          **English Specification:**
          * **Core Architecture**: Universal ARM Cortex-M33 (Fully compatible with both RP2350A and RP2350B series).
          * **Flash Hardening**: 6-divider + `PICO_EMBED_XIP_SETUP=1` (Enhanced driver stability and broad Flash chip compatibility, fixing soft-lock issues on 3rd-party Flash).
          * **Multi-Capacity Matrix**: This release includes 4 variants (2MB, 4MB, 8MB, and 16MB). Please choose according to your hardware Flash size:
            * **2MB Variant**: 1MB Firmware + 1MB User Storage
            * **4MB Variant**: 2MB Firmware + 2MB User Storage
            * **8MB Variant**: 2MB Firmware + 6MB User Storage
            * **16MB Variant**: 2MB Firmware + 14MB User Storage

          **中文说明：**
          * **内核架构**: 通用 ARM Cortex-M33 (完美兼容 RP2350A 与 RP2350B 全系芯片)。
          * **Flash 兼容**: 开启 6 分频与 `PICO_EMBED_XIP_SETUP`，修复官方 2 分频导致的普冉/兆易等第三方 Flash 软死锁/变砖问题。
          * **多容量可选**: 本次 Release 包含 2MB、4MB、8MB、16MB 四个版本，请根据实际硬件 Flash 选载：
            * **2MB 版**: 1MB 固件 + 1MB 用户磁盘
            * **4MB 版**: 2MB 固件 + 2MB 用户磁盘
            * **8MB 版**: 2MB 固件 + 6MB 用户磁盘
            * **16MB 版**: 2MB 固件 + 14MB 用户磁盘
          EOF

      - name: Publish to GitHub Releases
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetroMagic RP2350 Firmware (${{ env.MP_VERSION }})
          prerelease: false
          fail_on_unmatched_files: true
          files: RetroMagic_RP2350_*.uf2
          body_path: release_notes.md
