name: Build RetroMagic RP2350A

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新编译'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MicroPython Master Branch
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: master
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential python3 python3-pip python3-pyelftools pkg-config xxd

      - name: Build mpy-cross and Update Submodules
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules
          git submodule update --init --recursive lib/pico-sdk

      - name: Create RetroMagic RP2350A Board Files
        run: |
          BOARD_DIR="ports/rp2/boards/RETROMAGIC_RP2350A"
          mkdir -p $BOARD_DIR

          # 1. 板级 CMake 配置
          cat << 'EOF' > $BOARD_DIR/mpconfigboard.cmake
          set(PICO_BOARD pico2 CACHE STRING "" FORCE)
          set(PICO_PLATFORM rp2350 CACHE STRING "" FORCE)

          # 针对 ZD25Q32D (USON-8) 采用单线 03h 引导 + 4分频，规避 4-line QSPI 变砖
          set(PICO_DEFAULT_BOOT_STAGE2 boot2_generic_03h CACHE STRING "" FORCE)
          set(PICO_FLASH_SPI_CLKDIV 4 CACHE STRING "" FORCE)

          # 预留 3MB 内部文件系统
          set(MICROPY_HW_FLASH_STORAGE_BYTES 3145728)

          # TinyUSB 事件包装
          target_sources(${MICROPY_TARGET} PRIVATE ${CMAKE_CURRENT_LIST_DIR}/usb_wrap.c)
          target_link_options(${MICROPY_TARGET} PRIVATE "-Wl,--wrap=dcd_event_handler")
          EOF

          # 2. 板级 C 头文件
          cat << 'EOF' > $BOARD_DIR/mpconfigboard.h
          #define MICROPY_HW_BOARD_NAME "RetroMagic RP2350A"
          #define MICROPY_HW_MCU_NAME "RP2350A"

          #define MICROPY_HW_FLASH_MAX_FREQ (24000000)

          #define MICROPY_HW_UART0_TX (12)
          #define MICROPY_HW_UART0_RX (13)
          #define MICROPY_HW_UART0_CTS (-1)
          #define MICROPY_HW_UART0_RTS (-1)

          #define MICROPY_HW_I2C0_SDA (0)
          #define MICROPY_HW_I2C0_SCL (1)

          #define MICROPY_HW_SPI0_SCK (18)
          #define MICROPY_HW_SPI0_TX (19)
          #define MICROPY_HW_SPI0_RX (16)
          #define MICROPY_HW_SPI0_CS (17)
          EOF

          # 3. USB 适配代码
          cat << 'EOF' > $BOARD_DIR/usb_wrap.c
          #include "tusb.h"
          #include "mp_usbd.h"
          #include "py/mphal.h"

          extern void __real_dcd_event_handler(dcd_event_t const *event, bool in_isr);

          void __wrap_dcd_event_handler(dcd_event_t const *event, bool in_isr) {
              __real_dcd_event_handler(event, in_isr);
              mp_usbd_schedule_task();
              mp_hal_wake_main_task_from_isr();
          }
          EOF

      - name: Compile RetroMagic RP2350A Firmware
        run: |
          cd ports/rp2
          rm -rf build-RETROMAGIC_RP2350A
          
          # 直接用原生 cmake 初始化并显式传入 RP2350 参数
          cmake -B build-RETROMAGIC_RP2350A \
            -DBOARD=RETROMAGIC_RP2350A \
            -DPICO_BOARD=pico2 \
            -DPICO_PLATFORM=rp2350 \
            -DPICO_USE_PICOLIBC=0
            
          cmake --build build-RETROMAGIC_RP2350A -j$(nproc)

      - name: Verify Firmware Architecture
        run: |
          cd ports/rp2
          UF2_FILE="build-RETROMAGIC_RP2350A/firmware.uf2"
          
          echo "=== 检查 UF2 家族 ID ==="
          HEX_ID=$(xxd -s 28 -l 4 "$UF2_FILE" | awk '{print $2$3}')
          echo "读取到的 Family ID 16进制: $HEX_ID"
          echo "预期匹配: 59ff 8be4 (对应 RP2350 ARM-S 架构)"
          
          echo "=== 检查 CPU 编译器目标架构 ==="
          grep -o "cortex-[a-z0-9]*" build-RETROMAGIC_RP2350A/CMakeFiles/firmware.dir/link.txt | head -n 1 || true

      - name: Prepare Named UF2 File
        run: |
          DATE_TAG=$(date +'%Y%m%d')
          TARGET_FILENAME="RetroMagic_RP2350A_ZD25Q32D-${DATE_TAG}.uf2"
          mv ports/rp2/build-RETROMAGIC_RP2350A/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: retromagic-rp2350a-${{ env.DATE_TAG }}
          name: RetroMagic RP2350A Build ${{ env.DATE_TAG }}
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ env.TARGET_FILENAME }}
          body: |
            【RetroMagic RP2350A 专用 MicroPython 固件】

            1. **内核架构**：基于 MicroPython master (Pico-SDK 2.0+) 编译，确定为 ARM Cortex-M33 (RP2350) 架构（UF2 Family ID: 0xe48bff59）。
            2. **Flash 适配**：对 ZD25Q32D (USON-8) 采用 boot2_generic_03h 单线引导与 4 分频降频，解决死机无串口问题。
            3. **引脚分布**：UART0(12/13)、I2C0(0/1)、SPI0(16/17/18/19)。
