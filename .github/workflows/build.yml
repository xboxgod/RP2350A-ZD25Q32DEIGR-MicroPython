name: Auto Build MicroPython for ZD25Q32D

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Release Info
        id: get_latest
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Check if Version Already Built
        id: check_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "版本 $LATEST_TAG 已存在，跳过编译。"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "发现官方新版本 $LATEST_TAG，准备编译！"
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Checkout MicroPython Source Code
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake build-essential jq

      - name: Build mpy-cross
        if: env.SKIP != 'true'
        run: make -C mpy-cross

      - name: Patch Board Config for ZD25Q32D (Adjust Flash Timing via CMake)
        if: env.SKIP != 'true'
        run: |
          BOARD_CMAKE="ports/rp2/boards/RPI_PICO2/mpconfigboard.cmake"
          # 直接向 CMake 配置追加 Pico SDK 认可的 Flash 分频与 XIP 启动标志
          echo "set(PICO_EMBED_XIP_SETUP 1)" >> $BOARD_CMAKE
          echo "set(PICO_FLASH_SPI_CLKDIV 4)" >> $BOARD_CMAKE

      - name: Compile RP2350 Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          make BOARD=RPI_PICO2

      - name: Prepare Named UF2 File
        if: env.SKIP != 'true'
        run: |
          TARGET_FILENAME="RPI_PICO2_ZD25Q32DEIGR-${BUILD_DATE}-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RPI_PICO2/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: MicroPython ${{ env.LATEST_TAG }} (ZD25Q32D Custom Build)
          body: |
            针对 ZD25Q32D / ZD25Q32DEIGR Flash 芯片定制的 MicroPython 固件。
            （修改项：在 CMake 配置中强行开启 PICO_EMBED_XIP_SETUP=1 并将 Flash SPI 时钟分频降至 4）
            对应官方上游版本：${{ env.LATEST_TAG }}
          files: ${{ env.TARGET_FILENAME }}
