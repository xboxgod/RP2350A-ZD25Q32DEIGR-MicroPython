name: Build RetroMagic RP2350A

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新编译 (无视已发布的 Release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Tag
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "获取最新版本失败！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Check if Version Already Built
        id: check_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_REBUILD="${{ inputs.force_rebuild }}"
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "手动触发强制重编，跳过版本存在检查。"
            echo "SKIP=false" >> $GITHUB_ENV
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/retromagic-rp2350a-$LATEST_TAG)
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "版本 retromagic-rp2350a-$LATEST_TAG 已存在，跳过编译。"
              echo "SKIP=true" >> $GITHUB_ENV
            elif [ "$HTTP_STATUS" = "404" ]; then
              echo "确认版本未发布 (404 未找到)，准备编译。"
              echo "SKIP=false" >> $GITHUB_ENV
            else
              echo "GitHub API 异常 (HTTP $HTTP_STATUS)，停止构建防止误触发。"
              exit 1
            fi
          fi

      - name: Checkout MicroPython Source Code
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential python3 python3-pip python3-pyelftools pkg-config

      - name: Build mpy-cross and Fetch Submodules
        if: env.SKIP != 'true'
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules
          git submodule update --init --recursive lib/pico-sdk || true

      - name: Create RetroMagic RP2350A Board Files
        if: env.SKIP != 'true'
        run: |
          BOARD_DIR="ports/rp2/boards/RETROMAGIC_RP2350A"
          mkdir -p $BOARD_DIR

          # 【核心逻辑修正】借用 pico2 的合法身份，强制走 RP2350 工具链
          cat << 'EOF' > $BOARD_DIR/mpconfigboard.cmake
          # RetroMagic RP2350A 专用板级配置
          
          # 关键：必须指定为 pico2，告诉 pico-sdk 使用 RP2350 工具链 (cortex-m33)
          set(PICO_BOARD "pico2")
          set(PICO_BOARD_HEADER_DIRS ${CMAKE_CURRENT_LIST_DIR})
          
          # 强制指定平台为 rp2350，双保险
          set(PICO_PLATFORM "rp2350")
          
          # Flash 引导与时钟配置
          set(PICO_EMBED_XIP_SETUP 1)
          set(PICO_BOOT_STAGE2_CHOOSE_GENERIC_03H 1)
          set(PICO_FLASH_SPI_CLKDIV 8)
          
          # 4MB 中预留 3MB 给文件系统
          set(MICROPY_HW_FLASH_STORAGE_BYTES 3145728)
          
          # 注册 USB 修复源码
          target_sources(${MICROPY_TARGET} PRIVATE ${CMAKE_CURRENT_LIST_DIR}/usb_wrap.c)
          target_link_options(${MICROPY_TARGET} PRIVATE "-Wl,--wrap=dcd_event_handler")
          EOF

          # 板级头文件 (引脚映射与 Flash 参数)
          cat << 'EOF' > $BOARD_DIR/mpconfigboard.h
          #define MICROPY_HW_BOARD_NAME "RetroMagic RP2350A"
          #define PICO_RP2350A 1
          
          // 运行期 Flash 时钟限制为 18.75MHz（150MHz系统时钟 / 8）
          #define MICROPY_HW_FLASH_MAX_FREQ (18750000)
          
          // UART0 引脚映射
          #define MICROPY_HW_UART0_TX (12)
          #define MICROPY_HW_UART0_RX (13)
          #define MICROPY_HW_UART0_CTS (-1)
          #define MICROPY_HW_UART0_RTS (-1)
          
          // I2C0 引脚映射
          #define MICROPY_HW_I2C0_SDA (0)
          #define MICROPY_HW_I2C0_SCL (1)
          
          // SPI0 引脚映射
          #define MICROPY_HW_SPI0_SCK (18)
          #define MICROPY_HW_SPI0_TX (19)
          #define MICROPY_HW_SPI0_RX (16)
          #define MICROPY_HW_SPI0_CS (17)
          EOF

          # USB 包装修复文件
          cat << 'EOF' > $BOARD_DIR/usb_wrap.c
          #include "tusb.h"
          #include "mp_usbd.h"
          #include "py/mphal.h"

          extern void __real_dcd_event_handler(dcd_event_t const *event, bool in_isr);

          void __wrap_dcd_event_handler(dcd_event_t const *event, bool in_isr) {
              __real_dcd_event_handler(event, in_isr);
              mp_usbd_schedule_task();
              mp_hal_wake_main_task_from_isr();
          }
          EOF

      - name: Compile RetroMagic RP2350A Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          rm -rf build-RETROMAGIC_RP2350A
          # 通过 PICO_BOARD=pico2 彻底锁定 RP2350 平台
          make BOARD=RETROMAGIC_RP2350A PICO_BOARD=pico2 -j$(nproc) \
            CMAKE_ARGS="-DPICO_USE_PICOLIBC=0"

      - name: Verify Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          echo "=== 检查 UF2 家族 ID ==="
          xxd -s 28 -l 4 build-RETROMAGIC_RP2350A/firmware.uf2
          echo "期望输出: 59 ff 8b e4 (RP2350 ARM-S)"
          echo ""
          echo "=== 检查 CPU 架构（应包含 cortex-m33）==="
          grep -o "cortex-[a-z0-9]*" build-RETROMAGIC_RP2350A/CMakeFiles/firmware.dir/link.txt | head -n 1 || true

      - name: Prepare Named UF2 File
        if: env.SKIP != 'true'
        run: |
          TARGET_FILENAME="RetroMagic_RP2350A_ZD25Q32D-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RETROMAGIC_RP2350A/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: retromagic-rp2350a-${{ env.LATEST_TAG }}
          name: RetroMagic RP2350A ${{ env.LATEST_TAG }}
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ env.TARGET_FILENAME }}
          body: |
            【RetroMagic RP2350A 专用固件】
            
            基于 MicroPython ${{ env.LATEST_TAG }} 为 RetroMagic RP2350A 定制板编译。
            
            板级配置：
            1. **平台**：通过 `PICO_BOARD=pico2` 借用合法身份，强制使用 RP2350 (Cortex-M33) 工具链。
            2. **Boot2 引导**：使用 `boot2_generic_03h`（单线 03h 模式），启用 `PICO_EMBED_XIP_SETUP`。
            3. **Flash 时钟**：引导期与运行期均限制在 18.75MHz，确保 ZD25Q32D 时序稳定。
            4. **USB 修复**：注入 `--wrap=dcd_event_handler` 修复高版本 TinyUSB 枚举问题。
            5. **引脚映射**：UART0(12/13)、I2C0(0/1)、SPI0(16/17/18/19)。
