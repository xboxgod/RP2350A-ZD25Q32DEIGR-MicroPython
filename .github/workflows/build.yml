name: Build RetroMagic RP2350

on:
  schedule:
    - cron: '0 2 * * *' # 每天北京时间 10:00 自动巡检
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新编译（跳过 Release 已存在检查）'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MicroPython Master Branch
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: master
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Get MicroPython Official Version & Commit
        id: mp_info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          MP_VERSION=$(git describe --tags --always)
          DATE_TAG=$(date +'%Y%m%d')
          
          echo "COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "MP_VERSION=${MP_VERSION}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          
          RELEASE_TAG="v-${COMMIT_HASH}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          
          echo "官方最新 Commit: ${COMMIT_HASH}"
          echo "官方 MicroPython 版本: ${MP_VERSION}"
          echo "构建日期: ${DATE_TAG}"

      - name: Smart Check Build Eligibility
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: "${{ github.event_name }}"
          FORCE_INPUT: "${{ inputs.force_rebuild }}"
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_INPUT" = "true" ]; then
            echo "🚀 手动触发：强制执行重新编译！"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            if gh release view "${{ env.RELEASE_TAG }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
              echo "☕ 定时巡检：官方 MicroPython 无新 Commit (已构建过 Tag: ${{ env.RELEASE_TAG }})，自动跳过。"
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "⚡ 定时巡检：检测到官方 MicroPython 有新 Commit，触发自动编译！"
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install Build Dependencies
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential python3 python3-pip python3-pyelftools pkg-config xxd

      - name: Build mpy-cross and Update Submodules
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules

      - name: Inject Local Verified Board Strategy
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          BOARD_DIR="ports/rp2/boards/RETROMAGIC_RP2350"
          mkdir -p $BOARD_DIR

          # 1. CMake 策略
          cat << 'EOF' > $BOARD_DIR/mpconfigboard.cmake
          # cmake file for RETROMAGIC_RP2350
          set(MICROPY_BOARD_TARGET "rp2350-arm-s")
          set(PICO_BOARD "pico2")
          
          # 解锁 Pico SDK 的 XIP 最大寻址空间至 16MB
          set(PICO_FLASH_SIZE_BYTES 16777216)

          # 强制嵌入 XIP Flash 引导初始化
          set(PICO_EMBED_XIP_SETUP 1 CACHE STRING "" FORCE)
          add_compile_definitions(PICO_EMBED_XIP_SETUP=1)

          # 锁定 6 分频 (25MHz) 防死锁
          set(PICO_FLASH_SPI_CLKDIV 6 CACHE STRING "" FORCE)
          add_compile_definitions(PICO_FLASH_SPI_CLKDIV=6)
          EOF

          # 2. 板级 C 头文件 (修复常量初始化错误)
          cat << 'EOF' > $BOARD_DIR/mpconfigboard.h
          #ifndef MICROPY_INCLUDED_MPCONFIGBOARD_H
          #define MICROPY_INCLUDED_MPCONFIGBOARD_H

          #define MICROPY_HW_BOARD_NAME          "RetroMagic RP2350 Universal"
          #define MICROPY_HW_MCU_NAME            "RP2350"

          #undef MICROPY_HW_ENABLE_PSRAM
          #define MICROPY_HW_ENABLE_PSRAM        (0)

          #undef PICO_FLASH_SPI_CLKDIV
          #define PICO_FLASH_SPI_CLKDIV          6

          // 提供静态保底常量，满足 C 编译器及 pico_binary_info 初始化
          #undef MICROPY_HW_FLASH_STORAGE_BASE
          #define MICROPY_HW_FLASH_STORAGE_BASE  (1 * 1024 * 1024)
          #undef MICROPY_HW_FLASH_STORAGE_BYTES
          #define MICROPY_HW_FLASH_STORAGE_BYTES (1 * 1024 * 1024)

          // 开启开机运行钩子，在启动期强行覆写上述静态假定值
          #define MICROPY_BOARD_STARTUP board_init
          void board_init(void);

          #endif // MICROPY_INCLUDED_MPCONFIGBOARD_H
          EOF

          # 3. 板级 C 代码：利用 board_init 钩子动态修改文件系统对象
          cat << 'EOF' > $BOARD_DIR/board.c
          #include "py/mpconfig.h"
          #include "py/obj.h"
          #include "hardware/flash.h"
          #include "hardware/sync.h"
          #include "pico/stdlib.h"

          // 按照官方 rp2_flash.c 的结构体进行镜像声明，以便通过指针强行修改
          typedef struct _rp2_flash_obj_t {
              mp_obj_base_t base;
              uint32_t flash_base;
              uint32_t flash_size;
          } rp2_flash_obj_t;

          // 引入全局块设备对象
          extern rp2_flash_obj_t rp2_flash_obj;

          // 通过 0x9F 读取真实容量
          static uint32_t get_flash_total_bytes(void) {
              uint8_t txbuf[1] = { 0x9F };
              uint8_t rxbuf[3] = { 0 };

              uint32_t interrupts = save_and_disable_interrupts();
              flash_do_cmd(txbuf, rxbuf, 3);
              restore_interrupts(interrupts);

              uint8_t capacity_code = rxbuf[2];

              if (capacity_code >= 0x15 && capacity_code <= 0x19) {
                  return (1u << capacity_code) / 8;
              }
              return 4 * 1024 * 1024; // 异常兜底 4MB
          }

          // 系统开机极早期执行：在 LittleFS 挂载前，动态强行重置块大小
          void board_init(void) {
              uint32_t total = get_flash_total_bytes();
              
              if (total <= 2 * 1024 * 1024) {
                  // 2MB: 1MB 固件，1MB FS
                  rp2_flash_obj.flash_base = 1 * 1024 * 1024;
                  rp2_flash_obj.flash_size = 1 * 1024 * 1024;
              } else {
                  // >2MB: 预留 2MB 固件，其余全部划入 FS
                  rp2_flash_obj.flash_base = 2 * 1024 * 1024;
                  rp2_flash_obj.flash_size = total - (2 * 1024 * 1024);
              }
          }
          EOF

      - name: Compile RetroMagic RP2350 Firmware
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          make -C ports/rp2 BOARD=RETROMAGIC_RP2350 -j$(nproc)

      - name: Verify UF2 Architecture Safety (Family ID Check)
        if: steps.check_release.outputs.should_build == 'true'
        shell: bash
        run: |
          UF2_FILE="ports/rp2/build-RETROMAGIC_RP2350/firmware.uf2"
          
          echo "=== 检查 UF2 Family ID (偏移 28-31 字节) ==="
          HEX_ID=$(xxd -s 28 -l 4 "$UF2_FILE" | awk '{print $2$3}' | tr -d ' \n\r')
          echo "读取到的 Family ID (16进制): $HEX_ID"
          
          case "$HEX_ID" in
            57ff8be4|59ff8be4)
              echo "✅ 架构校验通过！确认为 RP2350 (Cortex-M33) 架构固件。"
              ;;
            *)
              echo "❌ 架构校验失败！读取到的是非法 ID ($HEX_ID)，终止发布！"
              exit 1
              ;;
          esac

      - name: Prepare Named UF2 File
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          CLEAN_MP_VERSION=$(echo "${{ env.MP_VERSION }}" | tr '/' '_')
          TARGET_FILENAME="RetroMagic_RP2350_${CLEAN_MP_VERSION}.uf2"
          
          mv ports/rp2/build-RETROMAGIC_RP2350/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Generate Release Notes File
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          cat << 'EOF' > release_notes.md
          ### ✨ RetroMagic RP2350 Universal Flash MicroPython
          ### ✨ RetroMagic RP2350 多硬件兼容版本 - 官方版同步更新

          ---

          #### 📋 Release Notes / 发布说明

          **English Specification:**
          * Core Architecture: ARM Cortex-M33 (`rp2350-arm-s` / UF2 Family ID: `0xe48bff57`)
          * Flash Hardening: 6-divider + PICO_EMBED_XIP_SETUP=1 (Enhanced driver stability and broad Flash chip compatibility)
          * Storage Layout: Auto-detects 0x9F JEDEC ID (1MB FS for 2MB Flash, max dynamic FS for 4MB/8MB/16MB Flash)

          **中文说明：**
          * 内核架构: ARM Cortex-M33 通用版 (兼容 RP2350A 及 RP2350B 全系芯片)
          * 防变砖策略: 6分频与驱动加固（全面兼容普冉、兆易、东芯等第三方 Flash，彻底解决官方 UF2 软死锁报错）
          * 存储空间: 动态 JEDEC ID 自动识别（2MB 芯片自动开辟 1MB 磁盘，>2MB 芯片自适应划拨剩余全部容量）
          EOF

      - name: Publish to GitHub Releases
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: RetroMagic RP2350 Universal Firmware (${{ env.MP_VERSION }})
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.TARGET_FILENAME }}
          body_path: release_notes.md
