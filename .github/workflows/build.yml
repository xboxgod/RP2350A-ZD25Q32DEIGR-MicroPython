name: Build MicroPython for RP2350A and ZD25Q32D

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rp2350-zd25q32d-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Find latest upstream stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/micropython/micropython/releases/latest --jq '.tag_name')
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected MicroPython release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=zd25q32d-$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null | head -n 1 || true)
          if [[ "$status" == *' 200 '* ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG exists; skipping."
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout MicroPython release and SDK
        if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ steps.upstream.outputs.tag }}
          submodules: recursive
          persist-credentials: false

      - name: Install build tools
        if: steps.check.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3

      - name: Create RP2350A board with generic 03h XIP
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk=lib/pico-sdk
          board=ports/rp2/boards/RP2350_ZD25Q32D
          test -f "$sdk/src/rp2350/boot_stage2/boot2_generic_03h.S"
          grep -q 'PICO_EMBED_XIP_SETUP=1' ports/rp2/CMakeLists.txt
          test "$(cat ports/rp2/boards/RPI_PICO2/mpconfigboard.cmake | grep -c 'set(PICO_BOARD "pico2")')" -eq 1
          test ! -e "$board"
          mkdir -p "$board"
          cat > "$board/mpconfigboard.cmake" <<'EOF'
          set(PICO_BOARD "rp2350_zd25q32d")
          # Select the RP2350-specific QMI 03h setup, including embedded XIP setup.
          set(PICO_DEFAULT_BOOT_STAGE2 "boot2_generic_03h")
          if(NOT DEFINED MICROPY_HW_FLASH_STORAGE_BYTES)
              set(MICROPY_HW_FLASH_STORAGE_BYTES 3145728)
          endif()
          EOF
          cat > "$board/mpconfigboard.h" <<'EOF'
          #define MICROPY_HW_BOARD_NAME "RP2350A ZD25Q32D 03h"
          EOF
          cat > "$sdk/src/boards/include/boards/rp2350_zd25q32d.h" <<'EOF'
          #ifndef _BOARDS_RP2350_ZD25Q32D_H
          #define _BOARDS_RP2350_ZD25Q32D_H
          // RP2350A with a 4 MiB external ZD25Q32D. No Pico 2-specific GPIOs.
          pico_board_cmake_set(PICO_PLATFORM, rp2350)
          #define PICO_RP2350A 1
          #define PICO_BOOT_STAGE2_CHOOSE_GENERIC_03H 1
          #define PICO_FLASH_SPI_CLKDIV 12
          pico_board_cmake_set_default(PICO_FLASH_SIZE_BYTES, (4 * 1024 * 1024))
          #ifndef PICO_FLASH_SIZE_BYTES
          #define PICO_FLASH_SIZE_BYTES (4 * 1024 * 1024)
          #endif
          #endif
          EOF
          grep -q 'PICO_BOOT_STAGE2_CHOOSE_GENERIC_03H 1' "$sdk/src/boards/include/boards/rp2350_zd25q32d.h"
          ! grep -q 'PICO_BOOT_STAGE2_CHOOSE_W25Q080' "$sdk/src/boards/include/boards/rp2350_zd25q32d.h"

      - name: Compile firmware
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -C mpy-cross -j 2
          make -C ports/rp2 submodules
          make -C ports/rp2 BOARD=RP2350_ZD25Q32D -j 2
          cache=ports/rp2/build-RP2350_ZD25Q32D/CMakeCache.txt
          grep -q 'PICO_BOARD:STRING=rp2350_zd25q32d' "$cache" || grep -q 'PICO_BOARD:UNINITIALIZED=rp2350_zd25q32d' "$cache"
          grep -Eq 'PICO_DEFAULT_BOOT_STAGE2:STRING=boot2_generic_03h|PICO_DEFAULT_BOOT_STAGE2:UNINITIALIZED=boot2_generic_03h' "$cache"
          test -s ports/rp2/build-RP2350_ZD25Q32D/firmware.uf2
          cp ports/rp2/build-RP2350_ZD25Q32D/firmware.uf2 "RP2350A-ZD25Q32D-03h-${{ steps.upstream.outputs.tag }}.uf2"
          sha256sum "RP2350A-ZD25Q32D-03h-${{ steps.upstream.outputs.tag }}.uf2" > SHA256SUMS.txt

      - name: Publish successful build
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_TAG: ${{ steps.upstream.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<EOF
          MicroPython upstream: ${UPSTREAM_TAG}
          Target: custom RP2350A board with Zetta ZD25Q32D, 4 MiB SPI NOR.
          RP2350 QMI XIP setup: generic 03h serial read, CLKDIV=12.
          Filesystem allocation: 3 MiB; remaining 1 MiB reserved for firmware.

          Experimental build: compilation is checked automatically; USB boot and
          flash stability must be verified on real hardware before general use.
          EOF
          gh release create "$RELEASE_TAG" \
            "RP2350A-ZD25Q32D-03h-${UPSTREAM_TAG}.uf2" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "RP2350A ZD25Q32D MicroPython ${UPSTREAM_TAG} (03h)" \
            --notes-file release-notes.txt --prerelease
