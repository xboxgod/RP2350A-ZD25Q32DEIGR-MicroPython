name: Auto Build MicroPython for RP2350A 4MB Flash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Release Info
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] \vert{}\vert{} [ -z "$LATEST_TAG" ]; then
            echo "获取最新版本失败！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Check if Version Already Built
        id: check_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "版本 $LATEST_TAG 已存在，跳过编译。"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "发现官方新版本 $LATEST_TAG，准备编译！"
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Checkout MicroPython Source Code
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential jq python3-pip python3-pyelftools

      - name: Build mpy-cross and Fetch Submodules
        if: env.SKIP != 'true'
        run: |
          make -C mpy-cross
          make -C ports/rp2 submodules

      - name: Create Isolated Custom Board (RP2350_4MB)
        if: env.SKIP != 'true'
        run: |
          # 1. 复制官方 RPI_PICO2 板级目录作为基础模板，独立为 RP2350_4MB
          # 彻底隔离 Pico SDK 默认对 RPI_PICO2 强制注入的 8MB 参数与 SFDP 设置
          cp -r ports/rp2/boards/RPI_PICO2 ports/rp2/boards/RP2350_4MB

          BOARD_H="ports/rp2/boards/RP2350_4MB/mpconfigboard.h"
          BOARD_CMAKE="ports/rp2/boards/RP2350_4MB/mpconfigboard.cmake"

          # 2. 修改 mpconfigboard.h：重新声明 4MB 物理限制及 LittleFS 边界
          echo "" >> $BOARD_H
          echo "#undef MICROPY_HW_BOARD_NAME" >> $BOARD_H
          echo "#define MICROPY_HW_BOARD_NAME \"RP2350A 4MB\"" >> $BOARD_H
          echo "#undef PICO_FLASH_SIZE_BYTES" >> $BOARD_H
          echo "#define PICO_FLASH_SIZE_BYTES (4 * 1024 * 1024)" >> $BOARD_H
          echo "#undef MICROPY_HW_FLASH_STORAGE_BYTES" >> $BOARD_H
          echo "#define MICROPY_HW_FLASH_STORAGE_BYTES (PICO_FLASH_SIZE_BYTES - MICROPY_HW_FLASH_STORAGE_OFFSET)" >> $BOARD_H

          # 3. 修改 mpconfigboard.cmake：强制使用与 CircuitPython 完全一致的单线 Fast Read 指令
          sed -i 's/RPI_PICO2/RP2350_4MB/g' $BOARD_CMAKE
          echo "set(PICO_FLASH_SIZE_BYTES 4194304 CACHE STRING \"\" FORCE)" >> $BOARD_CMAKE
          echo "set(PICO_FLASH_MODE \"qspi_fast_read\" CACHE STRING \"\" FORCE)" >> $BOARD_CMAKE
          echo "set(PICO_FLASH_SPI_CLKDIV 4 CACHE STRING \"\" FORCE)" >> $BOARD_CMAKE

      - name: Compile RP2350 Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          # 使用新建的独立板级 RP2350_4MB 编译
          make BOARD=RP2350_4MB

      - name: Prepare Named UF2 File
        if: env.SKIP != 'true'
        run: |
          TARGET_FILENAME="RP2350A_4MB_FastRead-${BUILD_DATE}-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RP2350_4MB/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: MicroPython ${{ env.LATEST_TAG }} (RP2350A 4MB Custom Board)
          body: |
            针对 RP2350A + Zetta ZD25Q32D (USON-8 4MB) 国产 Flash 的独立板级编译固件：
            1. 独立创建 `RP2350_4MB` 板级定义，避免官方 `RPI_PICO2` 配置覆盖；
            2. 使用 CircuitPython 相同的 `qspi_fast_read` 单线 Fast Read 指令（0x0B），完全绕过不标准的 SFDP/QE 参数协商；
            3. 锁定 Flash 容量为 4MB（`4194304` 字节），彻底消除 LittleFS 地址回卷；
            4. Flash 时钟降低至 37.5MHz (`PICO_FLASH_SPI_CLKDIV=4`) 确保稳定性。
            对应官方上游版本：${{ env.LATEST_TAG }}
          files: ${{ env.TARGET_FILENAME }}
