name: Build Custom RP2350A (ZD25Q32D)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新编译 (无视已发布的 Release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Tag
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] \vert{}\vert{} [ -z "$LATEST_TAG" ]; then
            echo "获取最新版本失败！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Check if Version Already Built
        id: check_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_REBUILD="${{ inputs.force_rebuild }}"
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "手动触发强制重编，跳过版本存在检查。"
            echo "SKIP=false" >> $GITHUB_ENV
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/zd25q32d-$LATEST_TAG)
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "版本 zd25q32d-$LATEST_TAG 已存在，跳过编译。"
              echo "SKIP=true" >> $GITHUB_ENV
            elif [ "$HTTP_STATUS" = "404" ]; then
              echo "确认版本未发布 (404 未找到)，准备编译。"
              echo "SKIP=false" >> $GITHUB_ENV
            else
              echo "GitHub API 异常 (HTTP $HTTP_STATUS)，停止构建防止误触发。"
              exit 1
            fi
          fi

      - name: Checkout MicroPython Source Code
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential python3 python3-pip python3-pyelftools

      - name: Build mpy-cross and Fetch Submodules
        if: env.SKIP != 'true'
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules

      - name: Create Custom SDK & MicroPython Board Profiles
        if: env.SKIP != 'true'
        run: |
          mkdir -p lib/pico-sdk/src/boards/include/boards
          cat << 'EOF' > lib/pico-sdk/src/boards/include/boards/rp2350_zd25q32d.h
          #ifndef _BOARDS_RP2350_ZD25Q32D_H
          #define _BOARDS_RP2350_ZD25Q32D_H
          
          pico_board_cmake_set(PICO_PLATFORM, rp2350)
          pico_board_cmake_set_default(PICO_FLASH_SIZE_BYTES, (4 * 1024 * 1024))
          
          #define PICO_RP2350A 1
          
          #define PICO_BOOT_STAGE2_CHOOSE_GENERIC_03H 1
          #define PICO_FLASH_SPI_CLKDIV 8
          #ifndef PICO_FLASH_SIZE_BYTES
          #define PICO_FLASH_SIZE_BYTES (4 * 1024 * 1024)
          #endif
          
          #define PICO_DEFAULT_I2C 0
          #define PICO_DEFAULT_I2C_SDA_PIN 0
          #define PICO_DEFAULT_I2C_SCL_PIN 1
          
          #define PICO_DEFAULT_SPI 0
          #define PICO_DEFAULT_SPI_SCK_PIN 18
          #define PICO_DEFAULT_SPI_TX_PIN 19
          #define PICO_DEFAULT_SPI_RX_PIN 16
          #define PICO_DEFAULT_SPI_CSN_PIN 17
          
          #define PICO_DEFAULT_UART 0
          #define PICO_DEFAULT_UART_TX_PIN 12
          #define PICO_DEFAULT_UART_RX_PIN 13
          
          #endif
          EOF
          
          mkdir -p ports/rp2/boards/RP2350_ZD25Q32D
          
          cat << 'EOF' > ports/rp2/boards/RP2350_ZD25Q32D/mpconfigboard.cmake
          set(PICO_BOARD "rp2350_zd25q32d")
          set(PICO_DEFAULT_BOOT_STAGE2 "boot2_generic_03h")
          
          # 强制将选定的 Boot2 嵌入最终固件 (RP2350 关键项)
          set(PICO_EMBED_XIP_SETUP 1)
          
          set(MICROPY_HW_FLASH_STORAGE_BYTES 3145728)
          
          # 修复 RP2350 上 MicroPython 潜在的 TinyUSB 枚举丢失 Bug
          add_link_options("-Wl,--wrap=dcd_event_handler")
          EOF
          
          cat << 'EOF' > ports/rp2/boards/RP2350_ZD25Q32D/mpconfigboard.h
          #define MICROPY_HW_BOARD_NAME "RP2350A ZD25Q32D Custom"
          
          #define MICROPY_HW_UART0_TX (12)
          #define MICROPY_HW_UART0_RX (13)
          
          // 强制 MicroPython 运行期的 Flash 时钟降频为 16MHz，防止运行时挂载系统掉盘
          #define MICROPY_HW_FLASH_MAX_FREQ (16000000)
          EOF

      - name: Compile RP2350 Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          make BOARD=RP2350_ZD25Q32D -j$(nproc)

      - name: Prepare Named UF2 File
        if: env.SKIP != 'true'
        run: |
          TARGET_FILENAME="RP2350A_ZD25Q32D_03h-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RP2350_ZD25Q32D/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zd25q32d-${{ env.LATEST_TAG }}
          name: MicroPython ${{ env.LATEST_TAG }} (ZD25Q32D 诊断构建版)
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ env.TARGET_FILENAME }}
          body: |
            【诊断与测试构建】针对定制 RP2350A 核心板 (ZD25Q32D 4MB) 编译。
            
            底层核心修正项：
            1. **Boot2 引导**：强制使用 `boot2_generic_03h` 并启用 `PICO_EMBED_XIP_SETUP` 确保嵌入固件。
            2. **全局 Flash 降频**：SDK 引导期启用 `CLKDIV 8`；MicroPython 运行期强制设定 `MICROPY_HW_FLASH_MAX_FREQ` 为 16MHz，双管齐下防止高速读写掉盘。
            3. **USB 枚举修复**：注入 `--wrap=dcd_event_handler` 规避高版本 TinyUSB 挂起 Bug。
            4. **引脚映射**：UART0 映射至 12/13；I2C0 映射至 0/1；释放 GPIO25。
