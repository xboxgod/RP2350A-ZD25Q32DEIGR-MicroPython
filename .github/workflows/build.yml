name: Auto Build MicroPython for RP2350A 4MB Flash

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Latest MicroPython Release Info
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/micropython/micropython/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" = "null" ] \vert{}\vert{} [ -z "$LATEST_TAG" ]; then
            echo "获取最新版本失败！"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          BUILD_DATE=$(date +'%Y%m%d')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Check if Version Already Built
        id: check_built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "版本 $LATEST_TAG 已存在，跳过编译。"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "发现官方新版本 $LATEST_TAG，准备编译！"
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Checkout MicroPython Source Code
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.LATEST_TAG }}
          submodules: recursive

      - name: Install Build Dependencies
        if: env.SKIP != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake build-essential jq python3-pip python3-pyelftools

      - name: Build mpy-cross and Fetch Submodules
        if: env.SKIP != 'true'
        run: |
          make -C mpy-cross
          make -C ports/rp2 submodules

      - name: Patch Board Headers and Board Cmake
        if: env.SKIP != 'true'
        run: |
          # 1. 修改 C 语言头文件，彻底修正 MicroPython LittleFS 文件系统大小为 4MB (4194304)
          BOARD_H="ports/rp2/boards/RPI_PICO2/mpconfigboard.h"
          echo "" >> $BOARD_H
          echo "#undef PICO_FLASH_SIZE_BYTES" >> $BOARD_H
          echo "#define PICO_FLASH_SIZE_BYTES (4 * 1024 * 1024)" >> $BOARD_H

          # 2. 修改 CMake 文件（对齐 CircuitPython 兼容模式）
          BOARD_CMAKE="ports/rp2/boards/RPI_PICO2/mpconfigboard.cmake"
          echo "set(PICO_FLASH_SIZE_BYTES 4194304 CACHE STRING \"\" FORCE)" >> $BOARD_CMAKE
          echo "set(PICO_FLASH_MODE \"qspi_fast_read\" CACHE STRING \"\" FORCE)" >> $BOARD_CMAKE
          echo "set(PICO_FLASH_SPI_CLKDIV 4 CACHE STRING \"\" FORCE)" >> $BOARD_CMAKE

      - name: Compile RP2350 Firmware
        if: env.SKIP != 'true'
        run: |
          cd ports/rp2
          # 3. 通过 CMAKE_ARGS 参数将环境变量直接推入 CMake 顶层，防止 Pico SDK 覆盖
          make BOARD=RPI_PICO2 CMAKE_ARGS="-DPICO_FLASH_SIZE_BYTES=4194304 -DPICO_FLASH_MODE=qspi_fast_read -DPICO_FLASH_SPI_CLKDIV=4"

      - name: Prepare Named UF2 File
        if: env.SKIP != 'true'
        run: |
          TARGET_FILENAME="RPI_PICO2_ZD25Q32D_4MB_FASTREAD-${BUILD_DATE}-${LATEST_TAG}.uf2"
          mv ports/rp2/build-RPI_PICO2/firmware.uf2 "${TARGET_FILENAME}"
          echo "TARGET_FILENAME=${TARGET_FILENAME}" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        if: env.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: MicroPython ${{ env.LATEST_TAG }} (RP2350A 4MB ZD25Q32D Fast-Read)
          body: |
            针对 RP2350A + Zetta ZD25Q32DEIGR (USON-8 4MB) Flash 的终极兼容固件：
            1. 传输指令最大化为单线读写 Fast Read (`PICO_FLASH_MODE=qspi_fast_read` 0x0B 指令)，避开 0xBB 指令导致的 BootROM 死锁；
            2. Flash 时钟修改为和CircuitPython相同的 37.5MHz (`PICO_FLASH_SPI_CLKDIV=4`)；
            3. 修正 Flash 尺寸为 4MB，解决 LittleFS 挂载越界引起的 HardFault。
            对应官方上游版本：${{ env.LATEST_TAG }}
          files: ${{ env.TARGET_FILENAME }}
